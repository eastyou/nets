<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长方体展开图</title>
<style>
@page { size: A4 portrait; margin: 14mm 13mm; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color: #1b2430;
  font-size: 11pt;
  line-height: 1.5;
}
h1 { font-size: 20pt; margin: 0 0 2mm; }
.sub { color: #6b7280; font-size: 10pt; margin: 0 0 5mm; }
ol.items { margin: 0; padding-left: 7mm; }
li.item { margin-bottom: 5.5mm; page-break-inside: avoid; }
.q { font-size: 11.5pt; margin-bottom: 1mm; }
.blank { display: inline-block; min-width: 30mm; border-bottom: 0.8pt solid #1b2430; height: 1.1em; }
.answers { page-break-before: always; }
.answers h2 { font-size: 15pt; margin: 0 0 4mm; }
.answers li { margin-bottom: 6mm; page-break-inside: avoid; }
.answers .ans { font-family: "SFMono-Regular", Consolas, monospace; color: #0f4c81; }
svg { display: block; margin: 1mm auto; }
.note { color: #6b7280; font-size: 9.5pt; }
table.info { border-collapse: collapse; margin-top: 3mm; font-size: 10pt; }
table.info th, table.info td { border: 0.4pt solid #d7dee6; padding: 1.6mm 3mm; text-align: left; }
table.info th { background: #f1f5f9; }
.face-label { font-size: 3.4px; }
@media print { li.item, .answers li { break-inside: avoid; } }
</style>
</head>
<body>
<h1>长方体展开图</h1>
<p class="sub">沿实线裁剪，沿相邻边折叠，就能拼成一个长方体。</p>
<svg xmlns="http://www.w3.org/2000/svg" width="128.00mm" height="88.00mm" viewBox="0 0 128.00 88.00" role="img" aria-label="长方体的展开图"><rect x="0.00" y="32.00" width="40.00" height="32.00" fill="#eff6ff" stroke="#1f2933" stroke-width="0.5"/><text x="20.00" y="47.00" text-anchor="middle" font-size="4" fill="#1f2933">前</text><text x="20.00" y="52.00" text-anchor="middle" font-size="3.2" fill="#52606d">5×4</text><rect x="40.00" y="32.00" width="24.00" height="32.00" fill="#fce7f3" stroke="#1f2933" stroke-width="0.5"/><text x="52.00" y="47.00" text-anchor="middle" font-size="4" fill="#1f2933">右</text><text x="52.00" y="52.00" text-anchor="middle" font-size="3.2" fill="#52606d">3×4</text><rect x="64.00" y="32.00" width="40.00" height="32.00" fill="#f0fdf4" stroke="#1f2933" stroke-width="0.5"/><text x="84.00" y="47.00" text-anchor="middle" font-size="4" fill="#1f2933">后</text><text x="84.00" y="52.00" text-anchor="middle" font-size="3.2" fill="#52606d">5×4</text><rect x="104.00" y="32.00" width="24.00" height="32.00" fill="#fef9c3" stroke="#1f2933" stroke-width="0.5"/><text x="116.00" y="47.00" text-anchor="middle" font-size="4" fill="#1f2933">左</text><text x="116.00" y="52.00" text-anchor="middle" font-size="3.2" fill="#52606d">3×4</text><rect x="40.00" y="0.00" width="40.00" height="24.00" fill="#e0f2fe" stroke="#1f2933" stroke-width="0.5"/><text x="60.00" y="11.00" text-anchor="middle" font-size="4" fill="#1f2933">上</text><text x="60.00" y="16.00" text-anchor="middle" font-size="3.2" fill="#52606d">5×3</text><rect x="40.00" y="64.00" width="40.00" height="24.00" fill="#fef3c7" stroke="#1f2933" stroke-width="0.5"/><text x="60.00" y="75.00" text-anchor="middle" font-size="4" fill="#1f2933">下</text><text x="60.00" y="80.00" text-anchor="middle" font-size="3.2" fill="#52606d">5×3</text></svg>
<table class="info"><tr><th>长</th><td>5 cm</td><th>宽</th><td>3 cm</td><th>高</th><td>4 cm</td></tr><tr><th>表面积</th><td>94 cm²</td><th>体积</th><td>60 cm³</td><th>展开图尺寸</th><td>16 × 11 cm</td></tr></table>
<p class="note">展开图中每个面上标注了该面的两条边长，可用来核对裁剪尺寸。</p>
</body>
</html>
